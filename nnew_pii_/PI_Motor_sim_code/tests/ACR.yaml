

suite:
  name: "ACC_Validation"
  version: "2.0"
  description: >
    Suite dédiée ACC. Valide l'engagement, le suivi, l'ouverture de gap
    et la reprise du speedlimiter. Assertions ACC sur gap_cm vs d_target.
  dut: "STM32F401RETx — acc_controller + speedlimiter"

config:
  can_interface: "can0"
  bitrate: 500000
  loop_period_ms: 10
  capture_interval_ms: 100
  reports_dir: "./reports"
  logs_dir: "./logs"

  motor:
    tau_ms: 10
    delay_ms: 1
    k_drag: 0.0


test_cases:

  - id: TC_ACC_001
    name: "ACC_TooClose_GapOpening"
    initial_vv: 85

    phases:
      -
        duration_ms: 30000
        radar:
          lead_present: true
          lead_speed_kmh: 80
          initial_distance_cm: 2000
        assert_end: {gap_min: 4500, gap_max: 4900}
      # Phase 2: lead accelerates progressively from 80 to 90 km/h over 10 s
      -
        duration_ms: 40000
        radar:
          lead_present: true
          lead_speed_kmh_start: 80
          lead_speed_kmh_end: 90
          lead_accel_mps2: 0.28   # ≈1.0 km/h/s, accel douce -> atteint 90 km/h en ~10s (== duration_ms)
         # initial_distance_cm: 4644
      -
        duration_ms: 40000
        radar:
          lead_present: true
          lead_speed_kmh_start: 90
          lead_speed_kmh_end: 100
          lead_accel_mps2: 0.28   # ≈1.0 km/h/s, accel douce -> atteint 90 km/h en ~10s (== duration_ms)
         # initial_distance_cm: 4644
      -
        duration_ms: 40000
        radar:
          lead_present: true
          lead_speed_kmh_start: 100
          lead_speed_kmh_end: 110
          lead_accel_mps2: 0.28   # ≈1.0 km/h/s, accel douce -> atteint 90 km/h en ~10s (== duration_ms)
         # initial_distance_cm: 4644