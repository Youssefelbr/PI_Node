suite:
  name: "Speed_Regulator_Validation"
  version: "2.0"
  author: ""
  description: "P-controller HIL validation over CAN — 4 functional test cases"
  dut: "STM32F401RETx — MCP2515 CAN speed controller"

config:
  can_interface: "can0"
  bitrate: 500000
  loop_period_ms: 10          # HIL loop period — do not change
  capture_interval_ms: 100    # how often a data row is logged
  reports_dir: "./reports"
  logs_dir: "./logs"

  # Embedded motor model parameters
  motor:
    tau_ms: 50               # inertia time constant (ms)
    delay_ms: 220             # transport delay (ms)
    k_drag: 0.0               # drag coefficient

test_cases:

  # ── TC_001 ────────────────────────────────────────────────────────────────
  - id: TC_001
    name: "Step_Response_Acceleration"
    description: >
      Vehicle starts from rest (0 km/h). Setpoint jumps to 100 km/h.
      Validates that the controller drives the speed up and converges
      within the tolerance window in 5 s.
    initial_vv: 0

    phases:
      - vset: 100
        duration_ms: 5000
        assert_end:
          vv_min: 80
          vv_max: 110

  # ── TC_002 ────────────────────────────────────────────────────────────────
  - id: TC_002
    name: "Multi_Step_Ramp"
    description: >
      Vehicle starts at 10 km/h. Setpoint increases in two steps:
      80 km/h for 3 s then 150 km/h for 3 s.
      Validates convergence at each operating point independently.
    initial_vv: 10

    phases:
      - vset: 80
        duration_ms: 3000
        assert_end:
          vv_min: 65
          vv_max: 90

      - vset: 150
        duration_ms: 3000
        assert_end:
          vv_min: 130
          vv_max: 160

  # ── TC_003 ────────────────────────────────────────────────────────────────
  - id: TC_003
    name: "Deceleration_Check"
    description: >
      Vehicle cruising at 150 km/h. Setpoint drops sharply to 40 km/h.
      Controller must output a negative command to brake the motor.
      Validates convergence after a large negative step in 4 s.
    initial_vv: 150

    phases:
      - vset: 40
        duration_ms: 4000
        assert_end:
          vv_min: 28
          vv_max: 52

  # ── TC_004 ────────────────────────────────────────────────────────────────
  - id: TC_004
    name: "Setpoint_Hold_Stability"
    description: >
      Vehicle accelerates from 0 to 100 km/h (phase 1, 5 s to converge),
      then the setpoint is held at 100 km/h for 4 s (phase 2).
      Validates that the controller maintains a stable speed without drift
      once the steady state is reached.
    initial_vv: 0

    phases:
      - vset: 100
        duration_ms: 5000
        assert_end:
          vv_min: 80
          vv_max: 110

      - vset: 100
        duration_ms: 4000
        assert_end:
          vv_min: 85
          vv_max: 110

  # ── TC_ACC_001 ────────────────────────────────────────────────────────────
  - id: TC_ACC_001
    name: "ACC_Engage_Follow_Resume"
    description: >
      Ego at 90 km/h, setpoint 100. Lead vehicle appears at 60 km/h,
      gap=800 cm. Ego must decelerate to follow. Lead disappears → resume cruise.
    initial_vv: 90

    phases:
      - vset: 100
        duration_ms: 2000
        assert_end: {vv_min: 90, vv_max: 105}   # still accelerating, no lead

      - vset: 100
        duration_ms: 5000
        radar:
          lead_present: true
          lead_speed_kmh: 60
          initial_distance_cm: 800
        assert_end: {vv_min: 50, vv_max: 75}   # following lead at ~60 km/h

      - vset: 100
        duration_ms: 4000
        radar:
          lead_present: false
        assert_end: {vv_min: 85, vv_max: 105}  # resumed cruise

  # ── TC_ACC_002 ────────────────────────────────────────────────────────────
  - id: TC_ACC_002
    name: "ACC_Too_Close_Gap_Opening"
    description: >
      Ego and lead both at 80 km/h, but initial gap=200 cm (below 400 cm safety).
      ACC must command deceleration to open the gap.
    initial_vv: 80

    phases:
      - vset: 80
        duration_ms: 5000
        radar:
          lead_present: true
          lead_speed_kmh: 80
          initial_distance_cm: 200
        assert_end: {vv_min: 60, vv_max: 80}   # slowed to open gap

  # ── TC_ACC_003 ────────────────────────────────────────────────────────────
  - id: TC_ACC_003
    name: "ACC_Lead_Decelerates"
    description: >
      Ego following at 80 km/h with stable gap. Lead decelerates hard to 30 km/h.
      Ego must decelerate and converge near lead speed.
    initial_vv: 80

    phases:
      - vset: 100
        duration_ms: 3000
        radar:
          lead_present: true
          lead_speed_kmh: 80
          initial_distance_cm: 400
        assert_end: {vv_min: 65, vv_max: 90}   # stable following

      - vset: 100
        duration_ms: 4000
        radar:
          lead_present: true
          lead_speed_kmh: 30
          initial_distance_cm: 400
        assert_end: {vv_min: 20, vv_max: 45}   # decelerated to match lead
